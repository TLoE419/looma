name: Bug report
description: Report a reproducible problem using non-sensitive examples.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use Security → Report a vulnerability instead. Remove secrets and personal data from all evidence."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/version, Looma commit, Rust version, and Codex CLI version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Remove credentials, personal paths, and private prompts.
